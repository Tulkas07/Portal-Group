{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="narrow">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button type="submit" class="btn">Зберегти</button>
      <a class="btn btn-ghost" href="{{ request.META.HTTP_REFERER|default:'/' }}">Скасувати</a>
      {% if delete_url %}<a class="btn btn-danger" href="{{ delete_url }}">Видалити</a>{% endif %}
    </div>
  </form>
</div>
{% endblock %}
