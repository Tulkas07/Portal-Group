<h1>{{ survey.title }}</h1>

<p>
    Вопрос {{ current }} из {{ total }}
</p>

<h2>{{ question.text }}</h2>

<form method="post">
    {% csrf_token %}

    {% for choice in question.choices.all %}
        <label>
            <input
                type="radio"
                name="choice"
                value="{{ choice.id }}"
                required
            >

            {{ choice.text }}
        </label>

        <br>
    {% endfor %}

    <br>

    <button type="submit">
        {% if current == total %}
            Завершить
        {% else %}
            Далее
        {% endif %}
    </button>
</form>
