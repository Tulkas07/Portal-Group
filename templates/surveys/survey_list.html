<h1>Опросы</h1>

{% for survey in surveys %}

    <div>
        <h2>{{ survey.title }}</h2>

        <p>{{ survey.description }}</p>

        <a href="{% url 'survey_start' survey.id %}">
            Пройти опрос
        </a>
    </div>

    <hr>

{% empty %}

    <p>Опросов пока нет.</p>

{% endfor %}
