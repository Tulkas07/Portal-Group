{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Вхід</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Увійти</button>
  </form>
  <p>Ще немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
</div>
{% endblock %}
